<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#144d34"/>
      <stop offset="50%" stop-color="#0c2f20"/>
      <stop offset="100%" stop-color="#061a11"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#10b981" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#34d399" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Plate Outer Ring -->
  <circle cx="256" cy="276" r="180" fill="none" stroke="#226747" stroke-width="12"/>
  <!-- Plate Inner Rim -->
  <circle cx="256" cy="276" r="146" fill="#092419" stroke="#34d399" stroke-width="3" stroke-opacity="0.25"/>

  <!-- Fresh Sprouts / Leaves on top of Plate -->
  <g filter="url(#glow)">
    <!-- Right Leaf -->
    <path d="M 256 128 C 250 56 306 24 380 24 C 392 98 340 144 256 128 Z" fill="url(#leafGrad)"/>
    <!-- Left Leaf -->
    <path d="M 256 128 C 228 72 170 58 116 78 C 132 134 186 150 256 128 Z" fill="#10b981" opacity="0.88"/>
    <!-- Stem & Center Vine -->
    <path d="M 256 128 Q 290 85 340 50" fill="none" stroke="#a7f3d0" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- "2nd" Logo Core Typography -->
  <g text-anchor="middle" font-family="'Inter Variable', 'Inter', system-ui, -apple-system, sans-serif">
    <!-- Big Stylized "2" -->
    <text x="215" y="340" font-size="205" font-weight="900" fill="#ffffff" letter-spacing="-8">2</text>
    <!-- "nd" superscript -->
    <text x="328" y="240" font-size="84" font-weight="800" fill="#34d399" letter-spacing="-1">nd</text>
    <!-- "PLATE" label below -->
    <text x="256" y="396" font-size="34" font-weight="900" fill="#a7f3d0" letter-spacing="8">PLATE</text>
  </g>

  <!-- Accent Hope Sparkle -->
  <path d="M 374 196 L 380 212 L 396 218 L 380 224 L 374 240 L 368 224 L 352 218 L 368 212 Z" fill="url(#goldGrad)"/>
</svg>
